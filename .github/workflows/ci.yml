name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, lint, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release CI dispatch context
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/release.yml

          require_dispatch_pattern() {
            local pattern="$1"
            local requirement="$2"
            if ! grep -Eq -- "$pattern" "$workflow"; then
              echo "::error file=$workflow::Release PR CI dispatch must $requirement."
              exit 1
            fi
          }

          require_dispatch_pattern \
            'gh[[:space:]]+workflow[[:space:]]+run[[:space:]]+ci\.yml' \
            'invoke ci.yml'
          require_dispatch_pattern \
            '--repo[[:space:]]+"\$GITHUB_REPOSITORY"' \
            'use --repo "$GITHUB_REPOSITORY"'
          require_dispatch_pattern \
            '--ref[[:space:]]+"\$head_branch"' \
            'use --ref "$head_branch"'

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            ndk;27.3.13750724

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Run all debug unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports-${{ github.run_number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
            data/schemas/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/lint-results-*.sarif
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build full debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: pocket-financer-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
