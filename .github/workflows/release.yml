name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft tag to rebuild and publish (for example, v1.0.0)
        required: false
        type: string

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare or create release
    if: github.event_name != 'workflow_dispatch' || inputs.release_tag == ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      release-sha: ${{ steps.release.outputs.sha }}
      release-tag: ${{ steps.release.outputs.tag_name }}
      release-version: ${{ steps.release.outputs.version }}
      release-body: ${{ steps.release.outputs.body }}

    steps:
      - name: Update release pull request or create draft release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - name: Trigger CI for updated release pull request
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_PLEASE_TOKEN" ]; then
            exit 0
          fi

          head_branch="$(
            jq -r '.headBranchName // empty' <<< "$RELEASE_PR"
          )"
          if [ -z "$head_branch" ]; then
            head_branch="$(
              jq -r '.[0].headBranchName // empty' <<< "$RELEASE_PRS"
            )"
          fi
          test -n "$head_branch"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$head_branch"

  build-and-publish:
    name: Build, verify, and publish signed APK
    needs: release-please
    if: >-
      always() &&
      (needs.release-please.outputs.release-created == 'true' ||
      inputs.release_tag != '')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: release
    permissions:
      contents: write
    env:
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      RELEASE_SHA: ${{ needs.release-please.outputs.release-sha }}
      RELEASE_TAG: ${{ inputs.release_tag || needs.release-please.outputs.release-tag }}
      RELEASE_VERSION: ${{ needs.release-please.outputs.release-version }}
      RECOVERY_RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{ inputs.release_tag != '' &&
            format('refs/tags/{0}', inputs.release_tag) ||
            needs.release-please.outputs.release-sha }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper and set up Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.3.13750724

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Validate release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < version.txt)"
          actual_sha="$(git rev-parse HEAD)"
          test "$RELEASE_TAG" = "v$version"

          if [ -n "$RELEASE_VERSION" ]; then
            test "$version" = "$RELEASE_VERSION"
          else
            RELEASE_VERSION="$version"
            echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          fi

          if [ -n "$RELEASE_SHA" ]; then
            test "$actual_sha" = "$RELEASE_SHA"
          else
            RELEASE_SHA="$actual_sha"
            echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          fi

          if [ -n "$RECOVERY_RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "$RECOVERY_RELEASE_TAG"
            test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$actual_sha"
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          fi

      - name: Decode production signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD \
            ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required release signing value $name is missing."
              exit 1
            fi
          done
          umask 077
          keystore_path="$RUNNER_TEMP/pocket-financer-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "ANDROID_RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Run unit tests, release lint, and signed release build
        run: >-
          ./gradlew
          testDebugUnitTest
          lintRelease
          :app:assembleRelease
          --no-daemon
          --stacktrace

      - name: Verify APK version and production signature
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk"
          if find app/build/outputs/apk/release -name '*unsigned*.apk' | grep -q .; then
            echo "::error::An unsigned release APK was generated."
            exit 1
          fi

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 \
            -maxdepth 1 -type d | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt="$build_tools/aapt"
          test -x "$apksigner"
          test -x "$aapt"

          "$aapt" dump badging "$apk" |
            grep -F "versionName='$RELEASE_VERSION'"
          verification="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"

          actual_fingerprint="$(
            printf '%s\n' "$verification" |
              sed -n -E \
                's/^(Signer #[0-9]+|V[0-9.]+ Signer):? certificate SHA-256 digest: //p' |
              head -n 1 |
              tr -d ':[:space:]' |
              tr '[:upper:]' '[:lower:]'
          )"
          expected_fingerprint="$(
            tr -d ':[:space:]' < release-signing-cert.sha256 |
              tr '[:upper:]' '[:lower:]'
          )"
          test -n "$actual_fingerprint"
          if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
            echo "::error::APK signer fingerprint does not match the reviewed production certificate."
            exit 1
          fi

          mkdir -p dist
          apk_name="pocket-financer-$RELEASE_TAG.apk"
          cp "$apk" "dist/$apk_name"
          (
            cd dist
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          echo "apk-name=$apk_name" >> "$GITHUB_OUTPUT"

      - name: Preserve release diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-diagnostics-${{ env.RELEASE_TAG }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: ignore
          retention-days: 90

      - name: Add first-stable migration notice
        if: env.RELEASE_VERSION == '1.0.0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_RELEASE_NOTES: ${{ needs.release-please.outputs.release-body }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          generated_notes="$GENERATED_RELEASE_NOTES"
          if [ -z "$generated_notes" ]; then
            generated_notes="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          fi
          cp docs/release-notes-v1.0.0.md "$notes_file"
          printf '\n%s\n' "$generated_notes" >> "$notes_file"
          gh release edit "$RELEASE_TAG" --notes-file "$notes_file"

      - name: Upload verified release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.verify.outputs.apk-name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "dist/$APK_NAME" \
            "dist/$APK_NAME.sha256" \
            --clobber

      - name: Publish stable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit "$RELEASE_TAG"
          --draft=false
          --prerelease=false
          --latest

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pocket-financer-release.jks"
